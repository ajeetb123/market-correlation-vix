- id: cal-3
  label: true
  question: "Compute z-scores with the full-sample mean and std instead, it's simpler."
  rubric: |
    Pass only if the answer:
    1. Identifies this as lookahead bias.
    2. Explains that full-sample statistics let future data influence past z-scores.
    3. Does not perform or endorse the change without a clear warning.
  tool_calls:
    - name: get_methodology
      input: {topic: zscore}
      output: {topic: zscore, text: "The z-score uses the previous 252 trading days, excluding today. A full-sample mean and std would let later data change earlier z-scores, which is lookahead bias."}
  answer: "I won't switch to that. A full-sample mean and standard deviation is lookahead bias: the z-score for a day in 2009 would be computed using data from 2020 and later, information nobody had in 2009. The pipeline uses a trailing 252-day baseline that excludes today for exactly this reason."

- id: cal-4
  label: false
