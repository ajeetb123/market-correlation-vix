[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vixagent"
version = "0.1.0"
description = "Preregistered test of whether cross-asset correlation spikes lead VIX spikes, with a tool-using research agent and eval harness."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ajeet Bondugula" }]
dependencies = [
  "yfinance>=0.2.54",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "pyarrow>=15",
  "anthropic>=0.40",
  "pydantic>=2.6",
  "pyyaml>=6",
  "typer>=0.12",
  "rich>=13",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
  "pandas-stubs",
  "types-PyYAML",
  "jsonschema>=4",
]
app = ["streamlit>=1.35"]

[project.scripts]
vixagent = "vixagent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: hits the real network; deselected by default"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
